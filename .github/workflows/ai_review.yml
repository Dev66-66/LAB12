name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]

jobs:
  ai-review:
    name: AI Code Review (Groq)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # required to post the review comment

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for accurate git diff

      # ── 1. Collect the PR diff ──────────────────────────────────────────
      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT
          cat pr_diff.txt

      # ── 2. Call Gemini API and generate the review ────────────────────
      - name: AI Code Review via Gemini API
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q google-genai
          python3 << 'PYEOF'
          import os
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY", "")
          if not api_key:
              print("ERROR: GEMINI_API_KEY is empty!")
              exit(1)

          try:
              diff = open("pr_diff.txt").read()[:6000]
          except FileNotFoundError:
              diff = "No diff available"

          client = genai.Client(api_key=api_key)

          prompt = (
              "Ты — senior Python разработчик. Проведи краткий code review"
              " следующего git diff для системы управления рестораном"
              " (FastAPI + SQLAlchemy).\n\n"
              + diff
              + "\n\nОтвет на русском языке в формате Markdown:\n\n"
              "## 🤖 AI Code Review (Gemini)\n\n"
              "### 🐛 Возможные баги\n"
              "### 🔒 Безопасность\n"
              "### ✅ Хорошие практики\n"
              "### 📋 Итог\n\n"
              "---\n"
              "*Автоматическое ревью от Google Gemini 2.0 Flash."
              " Результаты носят рекомендательный характер.*"
          )

          try:
              response = client.models.generate_content(
                  model="gemini-2.0-flash",
                  contents=prompt
              )
              review_text = response.text
              print("SUCCESS: Got review from Gemini")
          except Exception as e:
              print(f"Error: {e}")
              review_text = f"⚠️ Ошибка AI ревью: {e}"

          with open("review_comment.txt", "w") as f:
              f.write(review_text)
          PYEOF

      # ── 3. Post the review as a PR comment ──────────────────────────────
      - name: Post review comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment;
            try {
              comment = fs.readFileSync('review_comment.txt', 'utf8');
            } catch(e) {
              comment = '⚠️ AI Code Review не удалось выполнить: файл ревью не найден.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
