name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "app/**"
      - "tests/**"

jobs:
  ai-review:
    name: AI Code Review (Claude)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # required to post the review comment

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for accurate git diff

      # ── 1. Collect the PR diff ──────────────────────────────────────────
      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- app/ tests/ > pr_diff.txt
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT

      # ── 2. Call Claude API and generate the review ──────────────────────
      - name: AI Code Review via Claude API
        if: steps.diff.outputs.diff_size != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'EOF'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import URLError

          diff = open("pr_diff.txt").read()[:8000]   # stay within context budget

          prompt = f"""Ты — senior Python разработчик. Проведи code review следующего git diff для системы управления рестораном (FastAPI + SQLAlchemy).

          {diff}

          Ответ строго на русском языке в формате Markdown:

          ## 🤖 AI Code Review

          ### 🐛 Возможные баги
          [найденные баги или «Не обнаружено»]

          ### 🔒 Безопасность
          [уязвимости или «Не обнаружено»]

          ### ⚡ Производительность
          [проблемы производительности или «Не обнаружено»]

          ### 📝 Стиль и PEP 8
          [нарушения стиля или «Не обнаружено»]

          ### ✅ Хорошие практики
          [что сделано хорошо]

          ### 📋 Итог
          [1-2 предложения общего вывода]

          ---
          *Автоматическое ревью от Claude. Результаты носят рекомендательный характер.*"""

          payload = json.dumps({
              "model": "claude-sonnet-4-6",
              "max_tokens": 1500,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01",
              },
          )

          try:
              response = urlopen(req, timeout=60)
              result = json.loads(response.read())
              review_text = result["content"][0]["text"]
          except URLError as exc:
              review_text = (
                  "## 🤖 AI Code Review\n\n"
                  f"⚠️ Не удалось получить ответ от Claude API: `{exc}`\n\n"
                  "Проверьте, что секрет `ANTHROPIC_API_KEY` настроен корректно."
              )

          with open("review_comment.txt", "w", encoding="utf-8") as f:
              f.write(review_text)

          print("Review generated successfully.")
          EOF

      # ── 3. Post the review as a PR comment ──────────────────────────────
      - name: Post review comment to PR
        if: steps.diff.outputs.diff_size != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('review_comment.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });
            console.log('Review comment posted successfully.');
