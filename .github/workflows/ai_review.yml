name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]

jobs:
  ai-review:
    name: AI Code Review (Groq)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # required to post the review comment

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for accurate git diff

      # ── 1. Collect the PR diff ──────────────────────────────────────────
      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT
          cat pr_diff.txt

      # ── 2. Call Groq API and generate the review ──────────────────────
      - name: AI Code Review via Groq API
        if: always()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          api_key = os.environ.get("GROQ_API_KEY", "")
          if not api_key:
              print("ERROR: GROQ_API_KEY is empty!")
              exit(1)

          print(f"API key starts with: {api_key[:8]}...")

          try:
              diff = open("pr_diff.txt").read()[:6000]
          except FileNotFoundError:
              diff = "No diff available"

          prompt = (
              "Ты — senior Python разработчик. Проведи краткий code review следующего git diff.\n\n"
              + diff
              + "\n\nОтвет на русском языке в формате Markdown со следующими секциями:\n"
              "## 🤖 AI Code Review (Groq)\n"
              "### 🐛 Возможные баги\n"
              "### 🔒 Безопасность\n"
              "### ✅ Хорошие практики\n"
              "### 📋 Итог\n"
              "---\n"
              "*Автоматическое ревью от Groq (llama-3.3-70b-versatile)*"
          )

          payload = json.dumps({
              "model": "llama-3.3-70b-versatile",
              "max_tokens": 1000,
              "messages": [{"role": "user", "content": prompt}]
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}"
              }
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  review_text = result["choices"][0]["message"]["content"]
                  print("SUCCESS: Got review from Groq")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"HTTP Error {e.code}: {body}")
              review_text = f"⚠️ Ошибка AI ревью: HTTP {e.code}\n```\n{body}\n```"

          with open("review_comment.txt", "w") as f:
              f.write(review_text)
          PYEOF

      # ── 3. Post the review as a PR comment ──────────────────────────────
      - name: Post review comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment;
            try {
              comment = fs.readFileSync('review_comment.txt', 'utf8');
            } catch(e) {
              comment = '⚠️ AI Code Review не удалось выполнить: файл ревью не найден.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
