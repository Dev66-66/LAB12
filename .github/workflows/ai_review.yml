name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "app/**"
      - "tests/**"

jobs:
  ai-review:
    name: AI Code Review (Groq)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # required to post the review comment

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for accurate git diff

      # ── 1. Collect the PR diff ──────────────────────────────────────────
      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- app/ tests/ > pr_diff.txt
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT

      # ── 2. Call Groq API and generate the review ──────────────────────
      - name: AI Code Review via Groq API
        if: steps.diff.outputs.diff_size != '0'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'EOF'
          import os, json, urllib.request

          diff = open("pr_diff.txt").read()[:8000]

          prompt = f"""Ты — senior Python разработчик. Проведи code review следующего git diff для системы управления рестораном (FastAPI + SQLAlchemy).

          {diff}

          Ответ строго на русском языке в формате Markdown:

          ## 🤖 AI Code Review (Groq)

          ### 🐛 Возможные баги
          [найденные баги или «Не обнаружено»]

          ### 🔒 Безопасность
          [уязвимости или «Не обнаружено»]

          ### ⚡ Производительность
          [проблемы производительности или «Не обнаружено»]

          ### 📝 Стиль и PEP 8
          [нарушения стиля или «Не обнаружено»]

          ### ✅ Хорошие практики
          [что сделано хорошо]

          ### 📋 Итог
          [1-2 предложения общего вывода]

          ---
          *Автоматическое ревью от Groq (llama-3.3-70b-versatile). Результаты носят рекомендательный характер.*"""

          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps({
                  "model": "llama-3.3-70b-versatile",
                  "max_tokens": 1500,
                  "messages": [{"role": "user", "content": prompt}]
              }).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"
              }
          )
          response = urllib.request.urlopen(request)
          result = json.loads(response.read())
          review_text = result["choices"][0]["message"]["content"]

          with open("review_comment.txt", "w") as f:
              f.write(review_text)
          EOF

      # ── 3. Post the review as a PR comment ──────────────────────────────
      - name: Post review comment to PR
        if: steps.diff.outputs.diff_size != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('review_comment.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });
            console.log('Review comment posted successfully.');
